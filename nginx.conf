# Hardened static-file server for the AER landing site.
# HTTP only (TLS is expected to be terminated upstream); listens on 8080
# inside the container. The published port is bound to 127.0.0.1 on the host
# (see docker-compose.yml), so the service is never exposed on a public iface.
server {
    listen      8080;
    listen      [::]:8080;
    server_name _;

    root  /usr/share/nginx/html;
    index aer.app.html;

    # Don't leak the nginx version.
    server_tokens off;

    # Only allow safe, read-only methods for a static site.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Security headers.
    add_header X-Content-Type-Options    "nosniff"                       always;
    add_header X-Frame-Options           "SAMEORIGIN"                    always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin"                  always;
    # The page loads React/Babel from unpkg and Babel transpiles JSX at
    # runtime (needs 'unsafe-eval'); React injects inline styles
    # (needs 'unsafe-inline' for styles). Scoped as tightly as the app allows.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://unpkg.com; base-uri 'self'; frame-ancestors 'self'; object-src 'none'" always;

    # Static asset caching.
    location ~* \.(?:css|js|jsx|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Don't serve hidden files (e.g. .git, dotfiles) if any slip in.
    location ~ /\. {
        deny all;
    }

    # Quiet, non-disk error pages.
    error_page 404 =404 /aer.app.html;
}
