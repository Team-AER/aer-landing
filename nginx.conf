# Hardened static-file server for aer.app: the team page plus one landing page
# per app (/pensieve/, /quill/, ...). HTTP only (TLS is terminated upstream);
# listens on 8080 inside the container. The published port is bound to
# 127.0.0.1 on the host (see docker-compose.yml), so the service is never
# exposed on a public interface.

# Two content security policies. The team page and the Cantis and
# PolyJuiceVoice pages load React and Babel from unpkg and Babel transpiles
# JSX at runtime (needs 'unsafe-inline' and 'unsafe-eval'); every other page is
# plain HTML with first-party scripts only. Both allow Google Fonts.
map $uri $aer_csp {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'self'; frame-ancestors 'self'; form-action 'none'; object-src 'none'";
    "~^/(aer\.app\.html|(cantis|polyjuicevoice)/(index\.html)?)?$" "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://unpkg.com; base-uri 'self'; frame-ancestors 'self'; form-action 'none'; object-src 'none'";
}

server {
    listen      8080;
    listen      [::]:8080;
    server_name _;

    root  /usr/share/nginx/html;
    index aer.app.html index.html;

    # Don't leak the nginx version, and keep redirects relative so they work
    # behind the TLS-terminating host proxy.
    server_tokens off;
    absolute_redirect off;

    # Only allow safe, read-only methods for a static site.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    gzip on;
    gzip_types text/css application/javascript text/javascript text/plain image/svg+xml application/json;
    gzip_min_length 1024;

    # Security headers.
    add_header X-Content-Type-Options     "nosniff"                         always;
    add_header X-Frame-Options            "SAMEORIGIN"                      always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin"                     always;
    add_header Content-Security-Policy    $aer_csp                          always;

    # Static asset caching. HTML is always revalidated; stylesheets and
    # scripts for a day so a deploy reaches returning visitors quickly;
    # images and fonts for a week.
    location ~* \.(?:css|js|jsx)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location ~* \.(?:svg|png|jpg|jpeg|webp|avif|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Clean URLs: /pensieve -> /pensieve/ -> /pensieve/index.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # The base image ships nginx's own welcome and 50x pages; never show them.
    location = /index.html { return 301 /; }
    location = /50x.html   { return 404; }

    # Don't serve hidden files (e.g. .git, dotfiles) or the docs folder.
    location ~ /\. {
        deny all;
    }
    location ^~ /docs/ {
        return 404;
    }

    error_page 404 /404.html;
}
