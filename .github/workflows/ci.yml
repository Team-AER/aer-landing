name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build & smoke-test image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Build image
        run: docker build -t aer-landing:ci .

      - name: Run container
        run: |
          docker run -d --name aer-landing \
            -p 127.0.0.1:8080:8080 aer-landing:ci

      - name: Smoke test
        run: |
          for i in $(seq 1 15); do
            curl -fsS -o /dev/null http://127.0.0.1:8080/ && break
            sleep 2
          done
          set -e
          # The team page and every app page serve 200.
          for p in / $(find . -mindepth 2 -name index.html -not -path './.git/*' -not -path './docs/*' | sed 's#^\./##; s#index\.html$##'); do
            curl -fsS -o /dev/null "http://127.0.0.1:8080/$p" && echo "ok  /$p"
          done
          # Clean URLs redirect, unknown paths get the 404 page, docs stay private.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/pensieve)" = 301
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/no-such-app/)" = 404
          curl -s http://127.0.0.1:8080/no-such-app/ | grep -q "Nothing lives at this address"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/docs/APP-PAGES-DESIGN.md)" = 404
          # App pages get the strict CSP; only the team page may eval.
          curl -sI http://127.0.0.1:8080/pensieve/ | grep -i '^content-security-policy' | grep -vq "unsafe-eval"
          curl -sI http://127.0.0.1:8080/ | grep -i '^content-security-policy' | grep -q "unsafe-eval"

      - name: Tear down
        if: always()
        run: docker rm -f aer-landing || true
