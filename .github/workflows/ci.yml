name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build & smoke-test image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Build image
        run: docker build -t aer-landing:ci .

      - name: Run container
        run: |
          docker run -d --name aer-landing \
            -p 127.0.0.1:8080:8080 aer-landing:ci

      - name: Smoke test
        run: |
          for i in $(seq 1 15); do
            curl -fsS -o /dev/null http://127.0.0.1:8080/ && break
            sleep 2
          done
          set -e
          # The team page and every app page serve 200.
          for p in / $(git ls-files '*/index.html' | sed 's#index\.html$##'); do
            curl -fsS -o /dev/null "http://127.0.0.1:8080/${p#/}" && echo "ok  /${p#/}"
          done
          # Clean URLs redirect, unknown paths get the 404 page, docs stay private.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/pensieve)" = 301
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/no-such-app/)" = 404
          curl -s http://127.0.0.1:8080/no-such-app/ | grep -q "Nothing lives at this address"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/docs/APP-PAGES-DESIGN.md)" = 404
          # All pages use first-party compiled scripts and meaningful initial HTML.
          for p in / /pensieve/ /cantis/ /polyjuicevoice/; do
            curl -sI "http://127.0.0.1:8080$p" | grep -i '^content-security-policy' | grep -vq "unsafe-eval"
            curl -fsS "http://127.0.0.1:8080$p" -o /tmp/aer-page.html
            grep -q '<h1' /tmp/aer-page.html
          done
          for p in /app.jsx /tweaks-panel.jsx /package.json /scripts/build.mjs; do
            test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$p")" = 404
          done

      - name: Tear down
        if: always()
        run: docker rm -f aer-landing || true
